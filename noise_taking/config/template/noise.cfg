# Template config for noise_taking.sh — sourced as a bash file, so it's just
# variable assignments. Values here are noise_taking.sh's own defaults.
#
# For a new module, copy this whole folder (config + list files) and edit:
#   cp -r config/template config/<date>_<module>
#   ./noise_taking.sh -c <date>_<module> [--type n10,n1,f,s] [-R run] ...
#        (CLI flags override the values below)

# --- naming / output ---
tag="template"      # output dir = $MAS_DATA/noise_taking_<tag>_run<RUN>
types="n10,n1,f,s"  # default --type: comma-separated subset of n10, n1, f, s

# --- module / hardware ---
max_rows=41         # total number of rows (row_deselect, butterworth filter)
n_bias_lines=""     # number of tes bias lines; blank = read from the MCE
configprefix="config"   # MCE config file prefix in $MAS_DATA, archived with the run

# --- list files, relative to this config file's directory ---
# _test.txt variants in this folder are small lists for smoke tests, e.g.
#   -b tes_bias_list_test.txt -r fast_row_list_test.txt
#   --channel-list superfast_channel_list_test.txt
tes_bias_list="tes_bias_list.txt"              # line 1: bias sweep, line 2: biased columns
row_list="fast_row_list.txt"                   # fast: one row per line
channel_list="superfast_channel_list.txt"      # superfast: "row col1,col2,..."
                                               # (two-level AC: superfast_channel_list_two_level.txt,
                                               #  with superfast_ac2_cs=1 below)

# --- tes bias sweep ---
unlatch_bias=""     # tes_bias to unlatch at before the sweep; blank = skip (e.g. 32000)
unlatch_pause=2     # seconds to settle after unlatching
bias_pause=30       # seconds to settle after each bias step

# --- row_len sweep (n10/n1/f) ---
rowlens="89"        # comma-separated row_len values to sweep, e.g. "119,99,79,59"
f_cutoff=75         # butterworth filter cutoff, Hz

# --- samples per acquisition ---
nsamp_normal=2300       # normal_dm10.sh and normal_dm1.sh
nsamp_fast=204000       # fast.sh, per row
nsamp_superfast=4000000 # superfast.sh, divided across rows/cols

# --- superfast.sh ---
superfast_row_len=62        # 98 gives 250kHz, 62 gives 400kHz, 120 gives 200kHz
superfast_ccnumrows=41      # cc num_rows_reported during superfast acquisition
superfast_period=50         # fb_const square-wave half-period
superfast_stepsize=50       # fb_const square-wave step size around locking fb
superfast_ac2_cs=0          # 1: two-level AC (mux11d) -- channel list is
                            #    "row cs col1,col2,..." and the servo is frozen
                            #    with --ac2-cs; 0: "row col1,..."
