# Config for takeiv.sh — sourced as a bash file, so it's just variable
# assignments. Copy this file for each new setup and edit as needed.
#
# Usage: takeiv.sh -c example.cfg [-t temp] [-r run] [-s] [-l]
#        (CLI flags override the values below)

# --- module / hardware ---
nrow=22 # number of rows 
ncol=32 # number of columns MCE is taking data on

# --- naming / output ---
lcprefix="300K"            # lcname = LC_<lcprefix>_FPU_<temp>mK_datamode<datamode>_run<runN>
datadir="$MAS_DATA"       # base directory for output; e.g. "\$MAS_DATA" or "/data/cryo/current_data"

# --- takeiv.sh defaults (overridable with -t/-d/-r/-s/-l) ---
temp=245            # temperature for reference in mK
datamode=1          # usually only uses 0, 1 and 10
runN=0              # suffix run number, or string
savefig=1           # whether to save the lc plots (runs showiv.py)
eog=0               # whether to eog the saved lc plots
relock=0            # relock (flx_lp_init) after every bias step

# --- ivcurve.py params ---
columns="17 18 19 21 22 23 25 27"   # let's use the same in showiv.py
bias_start=15000
bias_step=-1
bias_count=15000
bias_pause=0.05
bias_final=0
zap_bias=32767
zap_time=1
settle_bias=15000
settle_time=10

### Typical values for reference
# Titanium
#  bias_start=10000  bias_step=-10  bias_count=1001  zap_bias=10000  zap_time=1.0
# Aluminum
#  bias_start=65000  bias_step=-100 bias_count=651
